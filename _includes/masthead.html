<header class="site-header">
  <nav class="site-nav" aria-label="主导航 / Main navigation">
    <div class="nav-actions">
      <div class="language-switcher" role="group" aria-label="语言 / Language">
        <button type="button" class="lang-btn active" data-language="zh" aria-pressed="true">中文</button>
        <button type="button" class="lang-btn" data-language="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <ul class="nav-links" id="main-navigation">
      {% for link in site.data.navigation.main %}
      <li><a href="{{ link.url }}"><span class="lang-zh">{{ link.title_zh }}</span><span class="lang-en">{{ link.title }}</span></a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
