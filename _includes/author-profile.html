<div class="sidebar-profile">
  <div class="profile-photo">
    <img id="author-avatar-img" src="{{ site.author.avatar | relative_url }}" alt="张新宇 / Xinyu Zhang" width="175" fetchpriority="high">
    <div class="avatar-switcher" role="group" aria-label="切换照片 / Choose photo">
      <button type="button" class="avatar-dot active" data-img="{{ '/images/ZXY-3.jpg' | relative_url }}" aria-label="照片 1 / Photo 1" aria-pressed="true"></button>
      <button type="button" class="avatar-dot" data-img="{{ '/images/ZXY-1.jpg' | relative_url }}" aria-label="照片 2 / Photo 2" aria-pressed="false"></button>
      <button type="button" class="avatar-dot" data-img="{{ '/images/ZXY-2.jpg' | relative_url }}" aria-label="照片 3 / Photo 3" aria-pressed="false"></button>
    </div>
  </div>
  <div class="profile-identity">
    <h1 id="profile-name">Xinyu Zhang <span>(张新宇)</span></h1>
    <p class="profile-role"><span class="lang-zh">华山菁英副教授</span><span class="lang-en">Huashan Elite Associate Professor</span></p>
    <p><span class="lang-zh">人工智能学院</span><span class="lang-en">School of Artificial Intelligence</span></p>
    <p><span class="lang-zh">西安电子科技大学</span><span class="lang-en">Xidian University</span></p>
    <p><span class="lang-zh">1999.12 · 山东泰安</span><span class="lang-en">1999.12 · Tai'an, Shandong</span></p>
    <p class="profile-office"><i class="fas fa-map-marker-alt" aria-hidden="true"></i> {{ site.author.location }}</p>
    <ul class="profile-links">
      <li><a href="mailto:{{ site.author.email }}"><i class="fas fa-envelope" aria-hidden="true"></i> Email</a></li>
      <li><a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener noreferrer"><i class="fas fa-graduation-cap" aria-hidden="true"></i> Google Scholar</a></li>
      <li><a href="https://orcid.org/0009-0008-7658-0116" target="_blank" rel="noopener noreferrer"><i class="ai ai-orcid" aria-hidden="true"></i> ORCID</a></li>
      <li><a href="https://dblp.org/pid/58/4582-21" target="_blank" rel="noopener noreferrer"><i class="ai ai-dblp" aria-hidden="true"></i> DBLP</a></li>
    </ul>
  </div>
</div>
