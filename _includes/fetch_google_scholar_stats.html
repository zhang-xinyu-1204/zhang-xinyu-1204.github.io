<script>
  document.addEventListener('DOMContentLoaded', function () {
    var citationElements = document.querySelectorAll('.show_paper_citations');
    if (!citationElements.length) return;
    {% if site.google_scholar_stats_use_cdn %}
    var statsUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json';
    {% else %}
    var statsUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json';
    {% endif %}
    fetch(statsUrl).then(function (response) {
      if (!response.ok) throw new Error('Citation data unavailable');
      return response.json();
    }).then(function (data) {
      citationElements.forEach(function (element) {
        var paper = data.publications && data.publications[element.getAttribute('data')];
        if (paper && paper.num_citations != null) element.textContent = '| Citations: ' + paper.num_citations;
      });
    }).catch(function () {});
  });
</script>
